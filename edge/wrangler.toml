name = "weatherkings-edge"
main = "worker.js"
compatibility_date = "2025-01-01"

[vars]
# Public URL of the Spring Boot API (replace with your deployed origin)
ORIGIN_URL = "https://api.example.com"

# Create the namespace with:  npx wrangler kv namespace create CACHE
# then paste the printed id here.
[[kv_namespaces]]
binding = "CACHE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

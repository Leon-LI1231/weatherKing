# Frontend-only CI for WeatherKings
# Assumes: frontend/ contains package.json
# Runner: tag "dind" (UW-Madison GitLab runner)

stages:
  - lint
  - unit_test
  - build

# Speed up installs between jobs
cache:
  key: ${CI_PROJECT_PATH_SLUG}-${CI_COMMIT_REF_SLUG}
  paths:
    - frontend/node_modules/
  policy: pull-push

######################
# 1) Lint
######################
lint_frontend:
  stage: lint
  image: node:20
  tags: [dind]
  before_script:
    - cd frontend
    - npm ci
  script:
    - npm run lint
    - npm run format:check
  artifacts:
    when: always
    paths:
      - frontend/.eslintcache
    expire_in: 1 week
  rules:
    - changes:
        - frontend/**


######################
# 2) Unit Tests (+ coverage)
######################
unit_test_frontend:
  stage: unit_test
  image: node:20
  tags: [dind]
  before_script:
    - cd frontend
    - npm ci
  script:
    # Jest example; if you use Vitest: `npx vitest run --coverage`
    - npm test -- --ci --coverage --coverageReporters=lcov --coverageReporters=cobertura --watchAll=false
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: frontend/coverage/cobertura-coverage.xml
    paths:
      - frontend/coverage/
    expire_in: 1 week
  # If your test runner doesn't print "All files | XX%" remove the next line
  coverage: '/All files[^|]*\|\s*([\d.]+)%\s*\|/'
  rules:
    - changes:
        - frontend/**

######################
# 3) Build (main only)
######################
build_frontend:
  stage: build
  image: node:20
  tags: [dind]
  before_script:
    - cd frontend
    - npm ci
  script:
    # Next.js: npm run build
    # Vite/CRA: ensure your package.json has the right build script
    - npm run build
    - ls -la
  artifacts:
    when: always
    paths:
      - frontend/.next/
      - frontend/out/
      - frontend/build/
      - frontend/dist/
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - frontend/**

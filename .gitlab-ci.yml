# Frontend-only CI configuration for WeatherKings
# Runs linting, testing, and building for the frontend/ directory only
# Requires a GitLab runner tagged "dind" (UW–Madison runner)

stages:
  - lint
  - unit_test
  - build

cache:                              # Speeds up installs by caching dependencies
  key: ${CI_PROJECT_PATH_SLUG}-${CI_COMMIT_REF_SLUG}
  paths:
    - frontend/node_modules/
  policy: pull-push

######################
# 1) Lint
######################
lint_frontend:
  stage: lint                       # Lint stage
  image: node:20                    # Use Node 20 image
  tags: [dind]
  before_script:
    - cd frontend
    - npm ci                        # Clean install dependencies
  script:
    - npm run lint                  # Run ESLint
    - npm run format:check         
  artifacts:                        
    when: always
    paths:
      - frontend/.eslintcache
    expire_in: 1 week
  rules:
    - changes: [frontend/**]        # Run only if frontend code changes

######################
# 2) Unit Tests
######################
unit_test_frontend:
  stage: unit_test                  # Unit test stage
  image: node:20
  tags: [dind]
  before_script:
    - cd frontend
    - npm ci
  script:
    - npm test -- --ci --coverage --coverageReporters=cobertura
  artifacts:                        # Save test coverage reports
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: frontend/coverage/cobertura-coverage.xml
    expire_in: 1 week
  coverage: '/All files[^|]*\|\s*([\d.]+)%\s*\|/'   # Regex for total coverage
  rules:
    - changes: [frontend/**]

######################
# 3) Build (main only)
######################
build_frontend:
  stage: build                      # Build stage
  image: node:20
  tags: [dind]
  before_script:
    - cd frontend
    - npm ci
  script:
    - npm run build                 # Run build command (Next.js/Vite/CRA)
    - ls -la               
  artifacts:                        
    when: always
    paths:
      - frontend/.next/
      - frontend/dist/
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'   # Only build on main branch
      changes: [frontend/**]

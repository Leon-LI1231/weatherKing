spring.application.name=WeatherKings
server.port=8080

spring.datasource.url=jdbc:mysql://db1:3306/weatherkings_db
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

weather.api.base-url=https://api.weather.gov
weather.api.user-agent=WeatherKings-App, contact@weatherkings.com

# Application-layer cache (Redis). Fails open: if Redis is down, requests go straight to the origin.
cache.enabled=${CACHE_ENABLED:true}
cache.forecast-ttl-seconds=600
cache.bets-ttl-seconds=30
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379
spring.data.redis.timeout=500ms

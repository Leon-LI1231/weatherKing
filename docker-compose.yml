services:
  db1:
    image: mysql/mysql-server:latest
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: weatherkings_db
      MYSQL_ROOT_HOST: '%'
    volumes:
      - wkdata:/var/lib/mysql
    ports:
      - "4306:3306"

# Frontend service
# After running `docker-compose up --build`, access the frontend at http://localhost:5173
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - PORT=5173

volumes:
  wkdata:

